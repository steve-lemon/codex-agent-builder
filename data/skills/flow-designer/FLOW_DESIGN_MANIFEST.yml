taskTypes:
  - id: blog-title-generation
    label: Blog Title Generation
    description: Generate publishable blog titles, headlines, or naming-style variants from a topic or keyword.
    examples:
      - 키워드를 줄테니 블로그 타이틀 여러개 만들기
      - blog title ideas from a keyword
      - headline suggestions for a productivity article
    signals:
      - blog
      - title
      - headline
      - 타이틀
      - 제목
    hints:
      fallbackWhenPlainText: false
  - id: json-generation
    label: Structured JSON Generation
    description: Generate machine-readable structured output such as JSON objects or item arrays.
    examples:
      - 상품 소개 문구를 JSON 형태로 여러개 만들어줘
      - return a structured list of items as json
    signals:
      - json
      - structured
      - object
      - 구조화
      - 객체
    hints:
      preferredWhenJson: true
  - id: text-generation
    label: General Text Generation
    description: Generate plain text responses when no specialized structured or title-oriented task type is a better fit.
    examples:
      - summarize this topic in plain text
      - 짧은 소개 문구 만들어줘
    signals:
      - text
      - plain text
      - 문구
      - 소개
    hints:
      fallbackWhenPlainText: true
  - id: text-editing
    label: Text Editing
    description: Revise, proofread, correct, or rewrite user-provided text without requiring external system integration.
    examples:
      - 이메일 내용의 오타를 정정해주기
      - 문장을 자연스럽게 교정해줘
      - proofread this email draft
    signals:
      - edit
      - revise
      - proofread
      - correct
      - rewrite
      - typo
      - draft
      - 교정
      - 정정
      - 수정
      - 오타
      - 다듬
      - 이메일 내용
      - 이메일 초안
    hints:
      fallbackWhenPlainText: true
  - id: text-summarization
    label: Text Summarization
    description: Summarize user-provided text into a requested number of lines or concise sentences.
    examples:
      - 블로그 내용을 줄테니 이걸 3줄로 요약해줘
      - summarize this article in three sentences
      - 본문을 짧게 요약해줘
    signals:
      - summarize
      - summary
      - 요약
      - 정리
      - 핵심
      - 3줄
      - 세 줄
      - three sentences
      - three lines
    hints:
      fallbackWhenPlainText: true
  - id: keyword-analysis
    label: Keyword Analysis
    description: Extract representative keywords or key phrases from user-provided text and present them clearly.
    examples:
      - 블로그 내용을 줄테니 키워드 분석 해줘
      - 이 문서에서 핵심 키워드를 추출해줘
      - extract the main keywords from this article
    signals:
      - key phrase
      - key phrases
      - extract
      - extraction
      - analyze
      - analysis
      - 핵심어
      - 핵심 키워드
      - 키워드 분석
      - 추출
      - 분석
    hints:
      fallbackWhenPlainText: true
  - id: text-analysis
    label: Text Analysis
    description: Analyze user-provided logs, reports, or source text to identify issues, causes, or notable findings.
    examples:
      - 에러 로그를 보고 문제점 파악해
      - 로그를 보고 원인 분석해줘
      - analyze this error log and identify the root cause
    signals:
      - analyze
      - analysis
      - diagnose
      - diagnostic
      - error log
      - stack trace
      - root cause
      - issue
      - problem
      - 로그
      - 에러 로그
      - 스택 트레이스
      - 원인
      - 진단
      - 문제점
      - 해결 방안
    hints:
      fallbackWhenPlainText: true
  - id: text-counting
    label: Text Counting
    description: Count characters, tokens, linguistic units, or extracted elements from text with exact or near-exact outputs.
    examples:
      - 입력의 자소를 분리한 카운트 보여줘
      - count vowels and consonants in the input
      - 텍스트 안의 항목 개수를 세어줘
    signals:
      - count
      - counting
      - frequency
      - 카운트
      - 개수
      - 빈도
      - 자소
      - 초성
      - 중성
      - 종성
      - 자음
      - 모음
      - 분리
    hints:
      fallbackWhenPlainText: true
  - id: graph-explanation
    label: Graph Explanation
    description: Analyze a provided graph-shaped JSON structure and explain its purpose or flow in natural language or markdown.
    examples:
      - 그래프(json)를 보고 이게 뭐하는 것인지 설명(md) 해줘
      - explain what this graph json does in markdown
    signals:
      - graph
      - json
      - explain
      - markdown
      - md
      - 그래프
      - 설명
      - 마크다운
    hints:
      fallbackWhenPlainText: true
