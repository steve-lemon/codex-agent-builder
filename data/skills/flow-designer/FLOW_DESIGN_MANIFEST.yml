classifierPrompts:
  taskTypeSystemPrompt: >-
    Choose the best flow-design task type for the request. Use only one of the provided taskType ids and explain the
    choice briefly.
  taskGraphSystemPrompt: >-
    Choose the best flow-design task graph template for the request. Use only one of the provided template ids and
    explain the choice briefly.
defaults:
  sampleInputs:
    default: 샘플 입력
    keywordDriven: 생산성 향상
    byTaskType:
      blog-title-generation: 원격 근무
      keyword-analysis: |-
        블로그 본문 예시입니다. 원격 협업 습관, 비동기 커뮤니케이션, 문서 중심 의사결정을 다룹니다. 마지막에는 팀 생산성을 높이는 실천 팁을 정리합니다.
      text-analysis: |-
        ERROR 2026-04-20 15:02:11 Database connection failed after retry 3. Timeout while connecting to db-primary. Subsequent requests returned 500 and stack trace references connection pool exhaustion.
      text-summarization: |-
        블로그 본문 예시입니다. 생산성을 높이는 습관과 협업 원칙을 설명합니다. 마지막에는 실천 팁을 정리합니다.
      text-counting: 한글
      graph-explanation: |-
        {
          "nodes": [
            { "id": "input-node", "blockId": "json-input", "label": "Graph Input" },
            { "id": "ai-node", "blockId": "ai-generate", "label": "Explain Graph" },
            { "id": "view-node", "blockId": "view", "label": "Review Explanation" }
          ],
          "edges": [
            { "sourceNodeId": "input-node", "targetNodeId": "ai-node", "label": "graph json" },
            { "sourceNodeId": "ai-node", "targetNodeId": "view-node", "label": "markdown explanation" }
          ]
        }
      json-generation: 샘플 입력
      text-generation: 샘플 입력
      unknown: 샘플 입력
  systemPrompts:
    blog-title-generation: You generate clear and catchy blog titles based on one keyword.
    keyword-analysis: You extract representative keywords from the provided text and keep them distinct, relevant, and easy to review.
    text-analysis: You analyze the provided text or logs, identify the core issue, explain likely causes, and suggest practical next steps.
    text-summarization: You summarize the provided text faithfully and keep the requested line or sentence count stable.
    text-counting: You count the requested text elements exactly and make the counting rule explicit.
    graph-explanation: You explain graph-shaped JSON structures clearly in Korean markdown.
    json-generation: You return concise structured output that can be safely parsed as JSON.
    text-generation: You transform text requests into concise useful outputs.
    unknown: You transform text requests into concise useful outputs.
  aiNodeDefaults:
    model: runtime-main-model
  probeDefaults:
    sampleConfig:
      model: runtime-main-model
    sampleInputs:
      system: You generate clear and catchy blog titles based on one keyword.
      prompt: 'User request: sample. Sample input: 샘플 입력. Return one result. Return plain text.'
  taskTypeSelection:
    jsonPreferredTaskTypeId: json-generation
    plainTextFallbackTaskTypeId: text-generation
knowledge:
  sharedDraftNotes:
    - Use only the blocks already available in the repository.
    - Ground the design in graph-based preflight validation before building the flow.
  conditionalDraftNotes:
    - match:
        taskTypes:
          - blog-title-generation
      notes:
        - Prefer publishable title quality over generic keyword stuffing.
    - match:
        wantsJson: true
      notes:
        - Keep downstream output JSON-shaped and machine-readable.
    - match:
        wantsMultiple: true
      notes:
        - Make repeated outputs explicit in the prompt wording and keep the requested count stable.
  reflectionNotes:
    - Prefer deterministic sample execution before accepting the design.
    - >-
      If the request needs capabilities that available blocks do not provide, stop early instead of forcing an invalid
      flow.
  reflectionRules:
    - id: short-title-output
      match:
        taskTypes:
          - blog-title-generation
        maxItemLength: 5
      issue: The output did not look like usable blog titles.
      suggestedImprovement: Make each result read like a publishable blog title.
      taskGraphRefinement:
        targetOperationPrefixes:
          - generate
        expectedOutputs:
          - publishable blog titles
        qualityHints:
          - Prefer polished, publication-ready title wording.
