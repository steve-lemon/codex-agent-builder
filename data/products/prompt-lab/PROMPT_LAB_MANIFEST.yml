version: 1
defaults:
  language: ko
  skillName: flow-designer
  outputRoot: output/labs
  providerOrder:
    - openai
    - gemini
    - fake
  skillOrder:
    - flow-preflight-validator
    - flow-designer
    - node-config-designer
cli:
  languages:
    ko:
      locale: ko-KR
      displayName: 한국어
      welcome: "Prompt Lab을 시작합니다. 실제 실행 결과를 바탕으로 Codex 프롬프트를 개선합니다."
      providerPrompt: "사용할 LLM provider를 선택하세요 (openai/gemini/fake)"
      skillPrompt: "검증할 skill을 선택하세요 (flow-preflight-validator/flow-designer/node-config-designer)"
      mainModelPrompt: "에이전트 메인 모델을 입력하세요"
      liteModelPrompt: "lite 모델을 입력하세요"
      languagePrompt: "세션 언어를 선택하세요 (ko/en)"
      requirementPrompt: "요구사항을 입력하세요"
      feedbackPrompt: "전체적인 피드백을 입력하세요. 빈 줄을 입력하면 종료합니다."
      feedbackDoneHint: "피드백 입력을 끝내려면 빈 줄을 입력하세요."
      startMessage: "에이전트 실행을 시작하고 로그를 기록합니다..."
      selfReviewMessage: "자가 평가를 생성했습니다."
      finalPromptMessage: "최종 Codex 프롬프트입니다."
      completionMessage: "세션 결과가 저장되었습니다:"
    en:
      locale: en-US
      displayName: English
      welcome: "Starting Prompt Lab. We will improve the Codex prompt from a real execution run."
      providerPrompt: "Choose the LLM provider (openai/gemini/fake)"
      skillPrompt: "Choose the skill to validate (flow-preflight-validator/flow-designer/node-config-designer)"
      mainModelPrompt: "Enter the agent main model"
      liteModelPrompt: "Enter the lite model"
      languagePrompt: "Choose the session language (ko/en)"
      requirementPrompt: "Enter the requirement"
      feedbackPrompt: "Add your feedback. Submit an empty line to finish."
      feedbackDoneHint: "Press Enter on an empty line when you are done."
      startMessage: "Starting the agent run and recording logs..."
      selfReviewMessage: "Generated self-review."
      finalPromptMessage: "Final Codex prompt:"
      completionMessage: "Saved session artifacts to:"
selfReview:
  systemPrompt: |
    You are reviewing a Codex agent run. Read the session snapshot and produce a compact, honest self-review.
    Focus on strengths, weaknesses, concrete improvements, and prompt focus areas.
codexPrompt:
  systemPrompt: |
    You are synthesizing a new Codex working prompt.
    Use the run result, self-review, and explicit user feedback.
    Return a practical prompt that helps Codex plan clearly, log important execution details, validate outcomes, and incorporate feedback in later iterations.
