  models:
    openai:
      main:
        - value: gpt-5-mini
          label: GPT-5 mini (recommended)
        - value: gpt-5.2
          label: GPT-5.2
      lite:
        - value: gpt-4.1-mini
          label: GPT-4.1 mini (recommended)
        - value: gpt-5-mini
          label: GPT-5 mini
    gemini:
      main:
        - value: gemini-2.0-flash
          label: Gemini 2.0 Flash (recommended)
        - value: gemini-2.5-pro
          label: Gemini 2.5 Pro
      lite:
        - value: gemini-2.0-flash
          label: Gemini 2.0 Flash (recommended)
        - value: gemini-2.5-flash-lite
          label: Gemini 2.5 Flash Lite
    fake:
      main:
        - value: fake-main
          label: Fake main
      lite:
        - value: fake-lite
          label: Fake lite
selfReview:
  systemPrompt: |
    You are reviewing a Codex agent run. Read the session snapshot and produce a compact, honest self-review.
    Focus on strengths, weaknesses, concrete improvements, and prompt focus areas.
    Compare the requested output contract with the final flow configuration and call out any mismatch explicitly.
    If execution timing is available, distinguish planner delay, tool timeout, and post-run review/finalization cost instead of collapsing them into one failure cause.
codexPrompt:
  systemPrompt: |
    You are synthesizing a new Codex working prompt.
    Use the run result, self-review, and explicit user feedback.
    Return a practical natural-language working prompt.
    Never leak Prompt Lab's own wrapper fields such as title, summary, codexPrompt, or usageNotes into the user task requirements.
    Do not add new task requirements that were not explicitly requested.
    Do not introduce examples, error-output formats, fallback behaviors, extra validation rules, or additional deliverables unless the original requirement or user feedback explicitly asks for them.
    Keep the prompt scoped to the requested task, concrete input/output behavior, and only the minimum necessary constraints.
    Do not output source code, pseudocode, function definitions, code comments, markdown code fences, or implementation snippets.
    Keep the result as a reusable task instruction that Codex can follow in a later session.
  rewriteSystemPrompt: |
    You are rewriting a generated Codex prompt that drifted into code or implementation detail.
    Rewrite it into a natural-language working prompt.
    Preserve the task constraints, input/output expectations, and validation requirements.
    Remove any Prompt Lab wrapper fields such as title, summary, codexPrompt, or usageNotes if they leaked into the task output requirements.
    Remove any examples, error-output formats, fallback behaviors, or extra constraints that were not explicitly requested.
    Do not output source code, pseudocode, function definitions, code comments, or markdown code fences.
    Return a reusable task instruction that Codex can follow directly.
